name: Docker Release

# Builds the current repository into its owner's GitHub Container Registry.
# Pushes to main publish main + sha tags; stable releases additionally publish latest.
# Manual builds publish branch + sha tags without replacing stable latest.
#
# Image: ghcr.io/<repository-owner>/<repository-name> (lowercase)
# Tags:
#   - Version tag stripped of 'v' prefix (e.g. release v1.2.3 → image tag 1.2.3)
#   - latest (stable releases only)
#   - main / branch name and sha-<full commit> (push/manual builds)
#
# Platforms: linux/amd64, linux/arm64

on:
  push:
    branches: [main]
    paths:
      - deeptutor/**
      - deeptutor_cli/**
      - web/**
      - requirements/**
      - requirements.txt
      - pyproject.toml
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-release.yml
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate-release-tag:
    name: Validate release tag
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.validate.outputs.image_tag }}
      is_stable: ${{ steps.validate.outputs.is_stable }}
      image: ${{ steps.validate.outputs.image }}
    steps:
      - name: Require an image version tag
        id: validate
        shell: python
        run: |
          import os
          import re

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image=ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}\n")
          if os.environ["GITHUB_EVENT_NAME"] != "release":
              raise SystemExit(0)
          tag = os.environ["RELEASE_TAG"]
          pattern = (
              r"^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:(?:a|b|rc)(?:0|[1-9]\d*))?"
              r"(?:\.post(?:0|[1-9]\d*))?"
              r"(?:\.dev(?:0|[1-9]\d*))?"
              r"(?:\+[0-9A-Za-z]+(?:[._-][0-9A-Za-z]+)*)?$"
          )
          if not re.fullmatch(pattern, tag):
              raise SystemExit(
                  f"Release tag {tag!r} is not an image version tag "
                  "(expected vX.Y.Z with an optional suffix)."
              )
          # '+' is valid version metadata but not valid in an OCI tag.
          image_tag = tag[1:].replace("+", "-")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image_tag={image_tag}\n")
              output.write(
                  "is_stable="
                  + str(bool(re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag))).lower()
                  + "\n"
              )
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  build-and-push:
    name: Build and Push Multi-Platform Docker Image
    needs: validate-release-tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Required for linux/arm64 cross-compilation on GitHub-hosted ubuntu runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Enable BuildKit with multi-platform build support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The validated version drops the leading 'v'. Pre-releases retain a
      # versioned image but never replace the stable 'latest' tag.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.validate-release-tag.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.validate-release-tag.outputs.image_tag }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false && needs.validate-release-tag.outputs.is_stable == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up repeated builds
          # mode=max caches all intermediate layers (frontend-builder and python-base are expensive)
          cache-from: type=gha
          cache-to: type=gha,mode=max
