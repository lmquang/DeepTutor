{{- if eq .Values.indexing.backend "kubernetes" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-indexing
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-indexing
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-indexing
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-indexing
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-indexing
{{- end }}
