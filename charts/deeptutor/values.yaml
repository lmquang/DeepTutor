image:
  repository: ghcr.io/hkuds/deeptutor
  tag: "1.6.15"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Existing Secret containing model_catalog.json (includes provider credentials).
# Bootstrap files seed an empty volume; existing settings are preserved.
bootstrapSecret: ""

config:
  system:
    backend_port: 8001
    frontend_port: 3782
    backend_workers: 1
  interface:
    theme: snow
    language: en
    response_language: en

persistence:
  storageClass: ""
  size: 20Gi

nodeSelector: {}
tolerations: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 6Gi

ingress:
  enabled: false
  className: tailscale
  hostname: deeptutor
  annotations: {}
