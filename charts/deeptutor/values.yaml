image:
  repository: ghcr.io/hkuds/deeptutor
  tag: "1.6.15"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Existing Secret containing model_catalog.json (includes provider credentials).
# Bootstrap files seed an empty volume; existing settings are preserved.
bootstrapSecret: ""

# Optional existing Secret containing GITHUB_TOKEN for repository sync.
githubSecret: ""

# Heavy API indexing runs in a subprocess by default. The kubernetes backend
# creates one namespace-scoped Job per indexing run.
indexing:
  backend: subprocess
  timeoutSeconds: 21600
  maxIsolatedWorkers: 1
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

config:
  system:
    backend_port: 8001
    frontend_port: 3782
    backend_workers: 1
  interface:
    theme: snow
    language: en
    response_language: en

persistence:
  storageClass: ""
  size: 20Gi

nodeSelector: {}
tolerations: []

resources:
  requests:
    cpu: "2"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 6Gi

ingress:
  enabled: false
  className: tailscale
  hostname: deeptutor
  annotations: {}
